name: Deploy static content to Pages
on:
  push:
    branches:
      - main # Execute on every push
    paths:
      - "src/**"
      - ".github/workflows/pages-build-deployment.yml"
      - "static/**"
      - "package-lock.json"
      - "*.js"
      - "*.cjs"
      - "*.ts"
      - "*.json"
  workflow_dispatch: # Execute on manual trigger
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Linux base image
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6 # Checkout repo

      - name: Setup pnpm
        # You may pin to the exact commit or the version.
        # uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        uses: pnpm/action-setup@v6.0.9
        with:
          cache: true
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm ci
      - name: Restore test and build cache
        id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules/.vite
            node_modules/.vitest
            .svelte-kit
          key: ${{ runner.os }}-build-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-cache-
      - name: build
        run: |
          pnpm install
          pnpm run build
      - name: deploy
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload build repo
          path: "./build/."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
