name: Run Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        # You may pin to the exact commit or the version.
        # uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        uses: pnpm/action-setup@v6.0.9
        with:
          cache: true
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm ci
      - name: Restore test and build cache
        id: test-build-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules/.vite
            node_modules/.vitest
            .svelte-kit
          key: ${{ runner.os }}-test-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-test-cache-
      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Save test and build cache
        if: success() && steps.test-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules/.vite
            node_modules/.vitest
            .svelte-kit
          key: ${{ runner.os }}-test-cache-${{ hashFiles('package-lock.json') }}      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
