name: Run Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore test and build cache
        id: test-build-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules/.vite
            node_modules/.vitest
            .svelte-kit
          key: ${{ runner.os }}-test-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-test-cache-
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm build
      - name: Save test and build cache
        if: success() && steps.test-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules/.vite
            node_modules/.vitest
            .svelte-kit
          key: ${{ runner.os }}-test-cache-${{ hashFiles('package-lock.json') }}      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
